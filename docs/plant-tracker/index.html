<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Sprout — Plant Care Tracker</title>
  <meta name="description" content="Track your plants, watering & fertilizing schedules, photos, and daily care checklists.">
  <meta name="theme-color" content="#2f6b3f">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sprout">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="topbar-inner">
        <span class="brand">🌱 Sprout</span>
        <button id="profileBtn" class="profile-chip" title="Switch who's caring today">👤</button>
      </div>
    </header>

    <main id="view" class="view"></main>

    <nav class="tabbar">
      <a href="#/today" data-tab="today" class="tab"><span class="tab-icon">✅</span><span>Today</span></a>
      <a href="#/plants" data-tab="plants" class="tab"><span class="tab-icon">🪴</span><span>Plants</span></a>
      <a href="#/add" data-tab="add" class="tab tab-add"><span class="tab-icon">＋</span><span>Add</span></a>
      <a href="#/guide" data-tab="guide" class="tab"><span class="tab-icon">📖</span><span>Guide</span></a>
      <a href="#/settings" data-tab="settings" class="tab"><span class="tab-icon">⚙️</span><span>Settings</span></a>
    </nav>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="vendor/supabase.js"></script>
  <script src="plants-data.js"></script>
  <script src="weather.js"></script>
  <script src="sync.js"></script>
  <script src="app.js"></script>
</body>
</html>
